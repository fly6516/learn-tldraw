<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>SimSun</family><prefer><family>Songti SC</family></prefer></alias>
  <alias><family>宋体</family><prefer><family>Songti SC</family></prefer></alias>
  <alias><family>SimHei</family><prefer><family>Heiti SC</family></prefer></alias>
  <alias><family>黑体</family><prefer><family>Heiti SC</family></prefer></alias>
  <alias><family>楷体</family><prefer><family>Songti SC</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Hiragino Sans GB</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Songti SC</family></prefer></alias>
</fontconfig>
