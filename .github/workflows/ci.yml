name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  latex-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LATEX_COMPILE_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - name: Install Tectonic
        env:
          VERSION: "0.15.0"
        run: |
          curl --fail --retry 3 --location --silent --show-error \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${VERSION}/tectonic-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/tectonic.tar.gz"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP" tectonic
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: tectonic --version
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run test:e2e
      - name: Verify the local trial without a model provider
        run: |
          bun run package:trial "$(command -v tectonic)"
          bundle="$(find build -mindepth 1 -maxdepth 1 -type d -name 'research-canvas-*' -print -quit)"
          "$bundle/start-research-canvas.sh" &
          workbench=$!
          trap 'kill "$workbench" 2>/dev/null || true' EXIT
          curl --fail --silent --retry-all-errors --retry 15 --retry-delay 1 "$RESEARCH_TRIAL_E2E_URL/research" --output /dev/null
          bun run test:e2e tests/e2e/workbench-setup.spec.ts tests/e2e/writing-sample.spec.ts
        env:
          RESEARCH_SAMPLE_NO_KEY: "1"
          RESEARCH_TRIAL_E2E_URL: "http://127.0.0.1:3179"
          RESEARCH_TRIAL_PORT: "3179"
          RESEARCH_TRIAL_NO_BROWSER: "1"
